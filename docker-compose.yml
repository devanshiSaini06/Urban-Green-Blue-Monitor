version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugbcm-backend
    ports:
      - "8000:8000"
    environment:
      - GEE_PROJECT_ID=graphic-tide-513321-m3
      - GEE_SERVICE_ACCOUNT_KEY_PATH=/app/secrets/gee-key.json
      - CACHE_DIR=/app/cache
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./backend/cache:/app/cache
      - ./secrets:/app/secrets:ro  # For GEE service account key
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ugbcm-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - backend

  # Optional: Redis for production caching
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

